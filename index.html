<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мовник</title>
<meta name="application-name" content="Mownyk">
<meta name="description" content="Мовник — застосунок для вивчення мов">
<meta name="theme-color" content="#4a3fc0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Мовник">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/appicon.png">
<link rel="manifest" href="/manifest.json">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f3;--surface:#fff;--surface2:#f0efe9;
  --border:rgba(0,0,0,.10);--border2:rgba(0,0,0,.18);
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --accent:#4a3fc0;--accent-light:#eeecfc;
  --ok:#2a7a3a;--ok-bg:#e6f5ea;
  --err:#b02020;--err-bg:#fdeaea;
  --r:10px;--rl:14px;--tr:.16s ease
}
@media(prefers-color-scheme:dark){:root{
  --bg:#18181a;--surface:#242428;--surface2:#2e2e34;
  --border:rgba(255,255,255,.10);--border2:rgba(255,255,255,.18);
  --text:#f0f0f0;--text2:#aaa;--text3:#666;
  --accent:#7b72e8;--accent-light:#2a274a;
  --ok:#4fba6a;--ok-bg:#1a3020;--err:#e06060;--err-bg:#2e1818
}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}

/* ── header ── */
.hdr{background:var(--surface);border-bottom:.5px solid var(--border);padding:0 20px;height:54px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100}
.logo{font-size:18px;font-weight:700;color:var(--accent);flex-shrink:0}
.bc{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text2);flex-wrap:wrap}
.bc-a{cursor:pointer;color:var(--accent)}.bc-a:hover{text-decoration:underline}
.bc-s{color:var(--text3)}.bc-c{font-weight:500}
.hdr-r{margin-left:auto;display:flex;gap:6px;flex-shrink:0}

/* ── buttons ── */
.btn{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:var(--r);border:.5px solid var(--border2);background:transparent;color:var(--text);font-size:13px;font-weight:500;cursor:pointer;transition:background var(--tr),transform var(--tr);white-space:nowrap}
.btn:hover{background:var(--surface2)}.btn:active{transform:scale(.98)}
.btn-p{background:var(--accent);color:#fff;border-color:transparent}.btn-p:hover{opacity:.9;background:var(--accent)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-d{color:var(--err);border-color:var(--err)}.btn-d:hover{background:var(--err-bg)}
.btn-ico{padding:6px;border-radius:8px;min-width:30px;justify-content:center}

/* ── layout ── */
.main{padding:24px 20px;max-width:820px;margin:0 auto}
.page{display:none}.page.active{display:block}
.ptitle{font-size:21px;font-weight:600;margin-bottom:6px}
.psub{color:var(--text2);font-size:14px;margin-bottom:22px}

/* ── lang grid ── */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.lcard{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:18px 16px;cursor:pointer;transition:border-color var(--tr),box-shadow var(--tr),transform var(--tr);position:relative}
.lcard:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(74,63,192,.12);transform:translateY(-2px)}
.lflag{font-size:34px;line-height:1;margin-bottom:8px}
.lname{font-size:15px;font-weight:600;margin-bottom:1px}.lnative{font-size:11px;color:var(--text3)}
.lact{position:absolute;top:9px;right:9px;display:none;gap:4px}.lcard:hover .lact{display:flex}
.ladd{background:var(--surface2);border:1.5px dashed var(--border2);border-radius:var(--rl);padding:18px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:var(--text2);font-size:13px;transition:border-color var(--tr),color var(--tr);min-height:106px}
.ladd:hover{border-color:var(--accent);color:var(--accent)}.ladd .plus{font-size:26px;font-weight:300}

/* ── tasks ── */
.th{display:flex;align-items:center;gap:11px;margin-bottom:22px}
.thfl{font-size:26px}.tlist{display:flex;flex-direction:column;gap:9px}
.titem{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:14px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:border-color var(--tr),transform var(--tr)}
.titem:hover{border-color:var(--accent);transform:translateX(3px)}
.temi{font-size:20px;width:34px;text-align:center;flex-shrink:0}
.tinf{flex:1;min-width:0}.tname{font-size:14px;font-weight:500}.tmeta{font-size:11px;color:var(--text3);margin-top:1px}
.tact{display:none;gap:4px}.titem:hover .tact{display:flex}
.tadd{background:var(--surface2);border:1.5px dashed var(--border2);border-radius:var(--rl);padding:14px 16px;display:flex;align-items:center;gap:9px;cursor:pointer;color:var(--text2);font-size:13px;transition:border-color var(--tr),color var(--tr)}
.tadd:hover{border-color:var(--accent);color:var(--accent)}

/* ── editor page ── */
.eph{margin-bottom:14px;display:flex;align-items:center;gap:11px;flex-wrap:wrap}
.etitle{font-size:18px;font-weight:600;border:none;background:transparent;color:var(--text);outline:none;flex:1;min-width:120px}
.etitle::placeholder{color:var(--text3)}
.mode-toggle{display:flex;gap:4px}
.mbtn{padding:6px 12px;border-radius:8px;border:.5px solid var(--border2);background:transparent;color:var(--text2);font-size:12px;font-weight:500;cursor:pointer;transition:all var(--tr)}
.mbtn.active{background:var(--accent);color:#fff;border-color:transparent}

/* direction bar */
.dbar{display:flex;align-items:center;gap:9px;background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:9px 14px;margin-bottom:14px;flex-wrap:wrap}
.dbtn{padding:6px 15px;border-radius:8px;border:.5px solid var(--border2);background:transparent;color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all var(--tr)}
.dbtn.active{background:var(--accent);color:#fff;border-color:transparent}
.dsep{color:var(--text3);font-size:16px}

/* panel */
.panel{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);overflow:hidden}
.ph{padding:9px 14px;border-bottom:.5px solid var(--border);background:var(--surface2);display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pdirl{font-size:13px;font-weight:700;color:var(--accent)}

/* toolbar */
.toolbar{display:flex;gap:4px;padding:7px 12px;border-bottom:.5px solid var(--border)}
.tb{padding:4px 8px;border:none;background:transparent;border-radius:5px;cursor:pointer;font-size:14px;color:var(--text2);transition:background var(--tr),color var(--tr);line-height:1;min-width:28px;text-align:center}
.tb:hover{background:var(--accent-light);color:var(--accent)}
.tb b{font-weight:700}.tb i{font-style:italic}.tb u{text-decoration:underline}

/* editable area (edit mode) */
.econtent{padding:16px;min-height:200px;outline:none;font-size:15px;line-height:1.85}

/* ── PRACTICE AREA ── */
/* The practice area is a static div (NOT contenteditable).
   We render it manually as HTML with .tw spans for triggers. */
.parea{padding:16px;min-height:200px;font-size:15px;line-height:1.85;user-select:none;cursor:default}

/* trigger word — clickable underlined span */
.tw{
  border-bottom:2px solid var(--accent);
  cursor:pointer;
  border-radius:2px;
  transition:background var(--tr);
  position:relative;
}
.tw:hover{background:var(--accent-light)}

/* state: open input */
.tw.tw-open{background:var(--accent-light);border-radius:4px}

/* inline input inside .tw */
.tw-input{
  display:inline-block;
  border:none;outline:none;
  background:transparent;
  font:inherit;color:var(--text);
  min-width:40px;width:auto;
  padding:0;margin:0;
  vertical-align:baseline;
}

/* state: answered correct */
.tw.tw-ok{border-bottom-color:var(--ok);background:var(--ok-bg);border-radius:4px;cursor:default;color:var(--ok)}

/* state: answered wrong */
.tw.tw-err{border-bottom-color:var(--err);background:var(--err-bg);border-radius:4px;cursor:default;color:var(--err)}

/* correct answer hint shown after wrong */
.tw-hint{font-size:11px;color:var(--ok);margin-left:5px;font-weight:500;border-left:1.5px solid var(--ok);padding-left:5px}

.pctrl{display:flex;gap:8px;padding:11px 14px;border-top:.5px solid var(--border)}
.pinfo{font-size:12px;color:var(--text3);padding:7px 14px;background:var(--surface2);border-top:.5px solid var(--border)}

/* ── modals ── */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:200;display:none;align-items:center;justify-content:center;padding:14px}
.mo.open{display:flex}
.md{background:var(--surface);border-radius:var(--rl);border:.5px solid var(--border);padding:22px;width:100%;max-width:450px;box-shadow:0 8px 32px rgba(0,0,0,.18)}
.mdtitle{font-size:17px;font-weight:600;margin-bottom:3px}
.mdsub{font-size:13px;color:var(--text2);margin-bottom:18px}
.mdact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.fg{margin-bottom:13px}
.fl{font-size:13px;font-weight:500;color:var(--text2);margin-bottom:5px;display:block}
.fi{width:100%;padding:8px 11px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--surface2);color:var(--text);font-size:14px;outline:none;font-family:inherit;transition:border-color var(--tr)}
.fi:focus{border-color:var(--accent)}.fi::placeholder{color:var(--text3)}
.lpgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:270px;overflow-y:auto}
.lpi{padding:9px 7px;border:.5px solid var(--border);border-radius:var(--r);text-align:center;cursor:pointer;transition:border-color var(--tr),background var(--tr)}
.lpi:hover,.lpi.sel{border-color:var(--accent);background:var(--accent-light)}
.lpif{font-size:22px;display:block}.lpin{font-size:11px;margin-top:2px;color:var(--text2)}
.sdiv{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--text3);font-size:12px}
.sdiv::before,.sdiv::after{content:'';flex:1;height:.5px;background:var(--border)}

/* toast */
.tc{position:fixed;bottom:22px;right:22px;z-index:300;display:flex;flex-direction:column;gap:7px;pointer-events:none}
.toast{background:var(--surface);border:.5px solid var(--border2);border-radius:var(--r);padding:9px 15px;font-size:13px;box-shadow:0 2px 12px rgba(0,0,0,.15);pointer-events:auto;animation:tin .2s ease;max-width:290px}
@keyframes tin{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
.toast.ok{border-left:3px solid var(--ok)}.toast.err{border-left:3px solid var(--err)}


/* ── sync badge ── */
.sync-badge{font-size:11px;padding:3px 9px;border-radius:20px;border:.5px solid var(--border2);color:var(--text3);background:var(--surface2);white-space:nowrap}
.sync-badge.syncing{color:var(--accent);border-color:var(--accent);background:var(--accent-light)}
.sync-badge.error{color:var(--err);border-color:var(--err);background:var(--err-bg)}

/* ── auth overlay ── */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);padding:36px 32px;max-width:380px;width:100%;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.auth-logo{font-size:48px;margin-bottom:12px}
.auth-title{font-size:22px;font-weight:700;color:var(--accent);margin-bottom:8px;letter-spacing:-.5px}
.auth-sub{font-size:14px;color:var(--text2);margin-bottom:28px;line-height:1.6}
.auth-btn{display:inline-flex;align-items:center;gap:10px;padding:12px 24px;border-radius:var(--r);border:.5px solid var(--border2);background:var(--surface);color:var(--text);font-size:14px;font-weight:600;cursor:pointer;transition:background var(--tr),box-shadow var(--tr);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.auth-btn:hover{background:var(--surface2);box-shadow:0 2px 8px rgba(0,0,0,.12)}

/* ── gemini panel ── */
.gem-panel{background:var(--surface);border:.5px solid var(--border);border-radius:var(--rl);margin-top:16px;overflow:hidden}
.gem-head{padding:10px 14px;background:var(--surface2);border-bottom:.5px solid var(--border);display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.gem-head-title{font-size:13px;font-weight:600;color:var(--text2);flex:1}
.gem-head-arrow{font-size:12px;color:var(--text3);transition:transform var(--tr)}
.gem-head-arrow.open{transform:rotate(180deg)}
.gem-body{display:none;flex-direction:column;gap:0}
.gem-body.open{display:flex}
.gem-input-row{padding:12px 14px;display:flex;gap:8px;align-items:flex-end;border-bottom:.5px solid var(--border)}
.gem-textarea{flex:1;resize:vertical;min-height:72px;padding:8px 11px;border:.5px solid var(--border2);border-radius:var(--r);background:var(--surface2);color:var(--text);font-size:13px;font-family:inherit;outline:none;transition:border-color var(--tr);line-height:1.5}
.gem-textarea:focus{border-color:var(--accent)}
.gem-textarea::placeholder{color:var(--text3)}
.gem-result{padding:14px;font-size:14px;line-height:1.75;color:var(--text);white-space:pre-wrap;min-height:60px;max-height:420px;overflow-y:auto}
.gem-result.loading{color:var(--text3);font-style:italic}
.gem-result.error{color:var(--err)}
.gem-footer{padding:10px 14px;border-top:.5px solid var(--border);display:flex;justify-content:flex-end;gap:8px}
</style>
</head>
<body>

<header class="hdr">
  <div class="logo">🌐 Мовник</div>
  <nav class="bc" id="bc"></nav>
  <div class="hdr-r" id="hdrR"></div>
</header>

<main class="main">

  <!-- LANGS -->
  <div class="page active" id="pgLangs">
    <div class="ptitle">Мої мови</div>
    <div class="psub">Оберіть мову для вивчення або додайте нову</div>
    <div class="lgrid" id="langGrid"></div>
  </div>

  <!-- TASKS -->
  <div class="page" id="pgTasks">
    <div class="th">
      <div class="thfl" id="tFlag"></div>
      <div>
        <div class="ptitle" id="tTitle"></div>
        <div class="psub" style="margin:0">Список завдань</div>
      </div>
    </div>
    <div class="tlist" id="taskList"></div>
  </div>

  <!-- EDITOR -->
  <div class="page" id="pgEditor">
    <div class="eph">
      <div class="thfl" id="eFlag"></div>
      <input class="etitle" id="eTitle" placeholder="Назва завдання…">
      <div class="mode-toggle">
        <button class="mbtn active" id="btnEdit" onclick="setMode('edit')">✏️ Редагування</button>
        <button class="mbtn" id="btnPrac" onclick="setMode('practice')">🎯 Практика</button>
      </div>
    </div>

    <div class="dbar">
      <button class="dbtn active" id="dA" onclick="switchDir('A')">RU → UA</button>
      <span class="dsep">⇄</span>
      <button class="dbtn" id="dB" onclick="switchDir('B')">UA → RU</button>
    </div>

    <div class="panel">
      <div class="ph">
        <span class="pdirl" id="pDirL">RU → UA</span>
      </div>

      <!-- EDIT toolbar + contenteditable -->
      <div id="editSection">
        <div class="toolbar">
          <button class="tb" title="Жирний" onmousedown="e=>e.preventDefault()" onclick="fmt('bold')"><b>B</b></button>
          <button class="tb" title="Курсив"  onmousedown="e=>e.preventDefault()" onclick="fmt('italic')"><i>I</i></button>
          <button class="tb" title="Підкреслений" onmousedown="e=>e.preventDefault()" onclick="fmt('underline')"><u>U</u></button>
        </div>
        <div class="econtent" id="ec" contenteditable="true" spellcheck="false"
             oninput="savePanel()" onkeyup="savePanel()"></div>
      </div>

      <!-- PRACTICE static div + controls -->
      <div id="pracSection" style="display:none">
        <div class="parea" id="pa"></div>
        <div class="pctrl">
          <button class="btn btn-p btn-sm" onclick="checkAll()">✅ Перевірити</button>
          <button class="btn btn-sm" onclick="resetPrac()">🔄 Скидання</button>
        </div>
        <div class="pinfo" id="pinfo"></div>
      </div>
    </div>

    <!-- GEMINI PANEL -->
    <div class="gem-panel" id="gemPanel">
      <div class="gem-head" onclick="toggleGemPanel()">
        <span style="font-size:16px">✨</span>
        <span class="gem-head-title">Генерація текстів через Gemini AI</span>
        <span class="gem-head-arrow" id="gemArrow">▼</span>
      </div>
      <div class="gem-body" id="gemBody">
        <div class="gem-input-row">
          <textarea class="gem-textarea" id="gemWords" placeholder="Введіть слова або словосполучення через кому або з нового рядка…"></textarea>
          <button class="btn btn-p btn-sm" id="gemGenBtn" onclick="gemGenerate()">✨ Згенерувати</button>
          <button class="btn btn-sm" onclick="gemClear()">🗑️ Очистити</button>
        </div>
        <div class="gem-result" id="gemResult" style="display:none"></div>
        <div class="gem-footer" id="gemFooter" style="display:none">
          <button class="btn btn-sm" onclick="gemTransfer()">📋 Перенести тексти в панелі</button>
        </div>
      </div>
    </div>
  </div>
</main>

<div class="tc" id="tc"></div>

<!-- modal: trigger table -->
<div class="mo" id="moTrig">
  <div class="md" style="max-width:560px">
    <div class="mdtitle">🔍 Таблиця тригерів</div>
    <div class="mdsub">Рядки з червоним фоном — відсутній тригер з одного боку</div>
    <div style="overflow-y:auto;max-height:60vh;border:.5px solid var(--border);border-radius:var(--r)">
      <table style="width:100%;border-collapse:collapse;font-size:14px">
        <thead id="trigTHead" style="background:var(--surface2);position:sticky;top:0"></thead>
        <tbody id="trigTBody"></tbody>
      </table>
    </div>
    <div class="mdact">
      <button class="btn btn-p" onclick="closeMo('moTrig')">Закрити</button>
    </div>
  </div>
</div>

<!-- modal: lang -->
<div class="mo" id="moLang">
  <div class="md">
    <div class="mdtitle" id="moLangT">Додати мову</div>
    <div class="mdsub">Оберіть зі списку або введіть вручну</div>
    <div class="lpgrid" id="lpg"></div>
    <div class="sdiv">або вручну</div>
    <div class="fg"><label class="fl">Прапор (emoji)</label><input class="fi" id="lFlag" style="font-size:19px;width:68px" maxlength="4" placeholder="🏳"></div>
    <div class="fg"><label class="fl">Назва мови</label><input class="fi" id="lName" placeholder="Французька"></div>
    <div class="fg"><label class="fl">Рідна назва (необов'язково)</label><input class="fi" id="lNative" placeholder="Français"></div>
    <div class="mdact">
      <button class="btn" onclick="closeMo('moLang')">Скасувати</button>
      <button class="btn btn-p" onclick="saveLang()">Зберегти</button>
    </div>
  </div>
</div>

<!-- modal: task -->
<div class="mo" id="moTask">
  <div class="md">
    <div class="mdtitle" id="moTaskT">Нове завдання</div>
    <div class="fg"><label class="fl">Emoji</label><input class="fi" id="tEmo" style="font-size:19px;width:68px" maxlength="4" placeholder="📝"></div>
    <div class="fg"><label class="fl">Назва</label><input class="fi" id="tName" placeholder="Наприклад: Здоров'я"></div>
    <div class="mdact">
      <button class="btn" onclick="closeMo('moTask')">Скасувати</button>
      <button class="btn btn-p" onclick="saveTask()">Зберегти</button>
    </div>
  </div>
</div>

<!-- modal: confirm -->
<div class="mo" id="moCfm">
  <div class="md" style="max-width:340px">
    <div class="mdtitle">Видалити?</div>
    <div class="mdsub" id="cfmTxt"></div>
    <div class="mdact">
      <button class="btn" onclick="closeMo('moCfm')">Скасувати</button>
      <button class="btn btn-d" id="cfmBtn">Видалити</button>
    </div>
  </div>
</div>

<script>
// ──────────────────────────────────────────────────────
// DATA
// ──────────────────────────────────────────────────────
const PRESETS=[
  {flag:'🇺🇦',name:'Українська',native:'Українська'},
  {flag:'🇷🇺',name:'Російська',native:'Русский'},
  {flag:'🇬🇧',name:'Англійська',native:'English'},
  {flag:'🇩🇪',name:'Німецька',native:'Deutsch'},
  {
